name: Publish to WinGet
on:
    release:
        types: [released]
permissions:
    contents: write

jobs:
    publish:
        runs-on: windows-latest
        steps:
            - uses: vedantmgoyal9/winget-releaser@main
              with:
                identifier: smartfrigde.Legcord
                installers-regex: '-win-\w+\.exe$'
                token: ${{ secrets.GITHUB_TOKEN }}
